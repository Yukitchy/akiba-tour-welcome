<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OGP v3 candidates — Akihabara Anime Tour</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #141414; color: #f7f2e9; font-family: "Helvetica Neue", Arial, sans-serif; padding: 40px 20px 64px; }
  header { max-width: 1200px; margin: 0 auto 36px; }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: .04em; }
  header p { margin-top: 8px; font-size: 14px; color: #b9b2a4; line-height: 1.6; }
  figure { max-width: 1200px; margin: 0 auto 44px; }
  figcaption { display: flex; align-items: baseline; gap: 14px; margin-bottom: 12px; }
  .num { font-size: 30px; font-weight: 800; color: #d83326; }
  .name { font-size: 16px; font-weight: 700; letter-spacing: .03em; }
  .desc { font-size: 13px; color: #b9b2a4; }
  img { width: 100%; height: auto; display: block; border: 1px solid #333; }
</style>
</head>
<body>
<header>
  <h1>OGP v3 候補（工夫あり）</h1>
  <p>汎用アキバツアー案内ページの OGP（1200×630）第3弾・5案。タイトルは左下寄せ、2行の左右幅は完全一致。実寸表示。番号で選んでください。</p>
</header>

<figure>
  <figcaption><span class="num">1</span><span class="name">Red Accent</span><span class="desc">夜景フルブリード＋深めのグラデーション、「ANIME」だけを赤で抜く</span></figcaption>
  <img src="ogp-v3-a.jpg" alt="Candidate 1: night photo, cream title with ANIME in red">
</figure>

<figure>
  <figcaption><span class="num">2</span><span class="name">Red Panel</span><span class="desc">左下コーナーに赤のベタパネルを敷き、クリーム文字を載せるポスター構成</span></figcaption>
  <img src="ogp-v3-b.jpg" alt="Candidate 2: solid red panel anchored bottom-left, cream type">
</figure>

<figure>
  <figcaption><span class="num">3</span><span class="name">Mono Red</span><span class="desc">写真を白黒に落とし、1行目クリーム＋2行目を丸ごと赤</span></figcaption>
  <img src="ogp-v3-c.jpg" alt="Candidate 3: black-and-white photo, cream first line, red second line">
</figure>

<figure>
  <figcaption><span class="num">4</span><span class="name">Duotone Big</span><span class="desc">赤デュオトーンの写真＋特大タイトル、タイトに切り抜いた構図</span></figcaption>
  <img src="ogp-v3-d.jpg" alt="Candidate 4: red duotone photo, oversized cream title, tight crop">
</figure>

<figure>
  <figcaption><span class="num">5</span><span class="name">Poster Block</span><span class="desc">タイトルの背後に黒ブロックをオフセットで敷く、印刷ポスター風</span></figcaption>
  <img src="ogp-v3-e.jpg" alt="Candidate 5: flat black offset block behind cream title, print-poster style">
</figure>

</body>
</html>
