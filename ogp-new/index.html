<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OGP redesign candidates — Akihabara Anime Tour</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #141414; color: #f7f2e9; font-family: "Helvetica Neue", Arial, sans-serif; padding: 40px 20px 64px; }
  header { max-width: 1200px; margin: 0 auto 36px; }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: .04em; }
  header p { margin-top: 8px; font-size: 14px; color: #b9b2a4; line-height: 1.6; }
  figure { max-width: 1200px; margin: 0 auto 44px; }
  figcaption { display: flex; align-items: baseline; gap: 14px; margin-bottom: 12px; }
  .num { font-size: 30px; font-weight: 800; color: #d83326; }
  .name { font-size: 16px; font-weight: 700; letter-spacing: .03em; }
  .desc { font-size: 13px; color: #b9b2a4; }
  img { width: 100%; height: auto; display: block; border: 1px solid #333; }
</style>
</head>
<body>
<header>
  <h1>OGP / バナー リデザイン候補</h1>
  <p>汎用アキバツアー案内ページの OGP（1200×630）新案5つ。実寸表示。番号で選んでください。</p>
</header>

<figure>
  <figcaption><span class="num">1</span><span class="name">Full-bleed Night</span><span class="desc">夜景フルブリード＋下部グラデーション、Archivo Expanded ExtraBold</span></figcaption>
  <img src="ogp-new-a.jpg" alt="Candidate 1: full-bleed Akihabara night photo with large cream title">
</figure>

<figure>
  <figcaption><span class="num">2</span><span class="name">Cream Editorial</span><span class="desc">クリーム地に Libre Franklin ExtraBold、罫線と赤ルールだけの編集デザイン</span></figcaption>
  <img src="ogp-new-b.jpg" alt="Candidate 2: cream background, oversized black Franklin type, red rule">
</figure>

<figure>
  <figcaption><span class="num">3</span><span class="name">Split Black</span><span class="desc">黒パネル＋右にフィギュア写真、Archivo ExtraBold を3行積み</span></figcaption>
  <img src="ogp-new-c.jpg" alt="Candidate 3: black panel with cream type, figure photo on the right">
</figure>

<figure>
  <figcaption><span class="num">4</span><span class="name">Minimal</span><span class="desc">Inter の大文字小文字タイトル、余白主体のミニマル</span></figcaption>
  <img src="ogp-new-d.jpg" alt="Candidate 4: minimal Inter title case design with negative space">
</figure>

<figure>
  <figcaption><span class="num">5</span><span class="name">Red Grid</span><span class="desc">赤地にクリームの Oswald、罫線グリッド＋ガシャポン写真パネル</span></figcaption>
  <img src="ogp-new-e.jpg" alt="Candidate 5: red background, cream Oswald type, hairline grid with photo panel">
</figure>

</body>
</html>
